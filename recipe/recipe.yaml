schema_version: 1

context:
  name: qiskit-finance
  version: "0.4.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/qiskit-finance-${{ version }}.tar.gz
  sha256: dd9559775918f79f4c5f31577a73cf5f135d1911e6601ebcc1ade3901949908d

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
  run:
    - qiskit >=0.45
    - qiskit-algorithms >=0.2.0
    - certifi
    - nasdaq-data-link
    - urllib3
    - fastdtw
    - numpy >=1.17
    - pandas
    - psutil >=5
    - python >=${{ python_min }}
    - qiskit-optimization >=0.6.0
    - scipy >=1.4
    - setuptools >=40.1.0
    - yfinance >=0.1.70

tests:
  - python:
      imports:
        - qiskit_finance
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: "Qiskit Finance: A library of quantum computing finance experiments"
  license: Apache-2.0
  license_file: LICENSE.txt
  homepage: https://github.com/qiskit-community/qiskit-finance

extra:
  recipe-maintainers:
    - wshanks
    - BastianZim
